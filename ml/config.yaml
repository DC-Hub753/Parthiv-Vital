# Reproducible pipeline configuration. No clinical dataset is bundled or downloaded.
project: vitalguard-ml
seed: 20261010
feature_version: vital-signs-v1
features:
  - age
  - heart_rate
  - spo2
  - systolic_bp
  - diastolic_bp
  - temperature
  - respiratory_rate
target:
  name: demo_heuristic_risk_label
  positive_class: 1
  definition: "Heuristic label used only for pipeline smoke tests; not a clinical outcome."
  prediction_time: "same observation time; synthetic demonstration only"
  outcome_window: "not applicable to synthetic heuristic labels"
split:
  train: 0.70
  validation: 0.15
  test: 0.15
  strategy: stratified-row-split-for-synthetic-smoke-test
model:
  algorithm: logistic_regression
  max_iter: 1200
  class_weight: balanced
  threshold: 0.5
artifact_dir: ml/artifacts
